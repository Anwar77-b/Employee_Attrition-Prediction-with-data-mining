[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0A0E17"
secondaryBackgroundColor = "#101826"
textColor = "#E6EDF7"
font = "monospace"

[server]
headless = true
runOnSave = false
fileWatcherType = "none"
maxUploadSize = 50

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[client]
showErrorDetails = false
toolbarMode = "minimal"
